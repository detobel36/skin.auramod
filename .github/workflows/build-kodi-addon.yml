name: Build Kodi Addon

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read addon info
        id: addon
        run: |
          ADDON_ID=$(grep -oP 'id="\K[^"]+' addon.xml | head -1)
          VERSION=$(grep -oP 'version="\K[^"]+' addon.xml | head -1)

          echo "addon_id=$ADDON_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare addon directory
        run: |
          mkdir -p build/${{ steps.addon.outputs.addon_id }}

          rsync -av ./ build/${{ steps.addon.outputs.addon_id }}/ \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "build" \
            --exclude "__pycache__" \
            --exclude "*.pyc"

      - name: Create ZIP package
        run: |
          mkdir -p dist

          cd build

          zip -r \
            ../dist/${{ steps.addon.outputs.addon_id }}-${{ steps.addon.outputs.version }}.zip \
            ${{ steps.addon.outputs.addon_id }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodi-addon
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
